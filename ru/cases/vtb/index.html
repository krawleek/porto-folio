<section class="case-intro">
<h1 class="">Проектирование личного кабинета клиента&nbsp;ВТБ НПФ</h1>
<div class="case-lead">
<p>ВТБ НПФ — один из крупнейших негосударственных пенсионных фондов России (11&nbsp;млн&nbsp;клиентов), управляющий долгосрочными накоплениями граждан.</p>
<p>Я провела редизайн легаси-системы на основе UX-аудита и разработала продуктовую логику кабинета с фокусом на достижение долгосрочной финансовой цели.</p>
</div>
<dl class="case-meta">
<div><dt>Роль</dt><dd>Product designer</dd>
</div>
<div><dt>Процесс</dt><dd>Research • UX/UI • Prototyping • Product Vision • Testing</dd>
</div>
<div><dt>Команда</dt><dd><span>Роман Беньо, арт-директор</span><br><a href="https://edgor.fixframer.ru/" target="_blank" rel="noopener noreferrer"><span>Эдуард Горбунов, Senior Product Designer</span> ↗</a></dd>
</div>
<div><dt>Дата</dt><dd>2025–2026</dd>
</div>
</dl>
<div class="vtb-cover"><img class="case-image" src="/assets/vtb/hero.png" alt="Личный кабинет ВТБ НПФ — новый интерфейс" loading="lazy" decoding="async">
</div>
</section>
<section>
<div class="case-context">
<p>Проект начался с UX-аудита всего цифрового клиентского пути ВТБ НПФ: от корпоративного сайта и оформления договора до личного кабинета.</p>
<p>В отличие от остальных точек взаимодействия, личный кабинет фонда — это legacy-продукт. Он позволял посмотреть состояние договора и выполнить базовые операции, но практически не помогал разобраться в программе и понять, что делать дальше.</p>
</div>
</section>

<section>
<div class="case-context">
<p>Это становилось бизнес-проблемой: пенсионные программы рассчитаны на долгосрочные отношения с клиентом, а их условия во многом определяются государством и мало отличаются между фондами.</p>
<p>Поэтому одним из ключевых конкурентных факторов становится качество клиентского опыта.</p>
</div>
</section>
<section>
<h2 class="">Бизнес-цели</h2>
<p class="case-lead solution-lead">Для бизнеса было важно не просто обновить интерфейс, а сделать цифровой сервис инструментом долгосрочного взаимодействия с клиентом.</p>
<div class="business-goals">
<article>
<h3><img class="goal-icon" src="/assets/vtb/imgWallet.svg" alt="" loading="lazy" decoding="async">Увеличить объём взносов</h3>
<p class="">Рост использования автоплатежей</p>
</article>
<article>
<h3><img class="goal-icon" src="/assets/vtb/imgStats.svg" alt="" loading="lazy" decoding="async">Вырастить вовлечение</h3>
<p class="">Прогноз накоплений и персональные рекомендации</p>
</article>
<article>
<h3><img class="goal-icon" src="/assets/vtb/imgComponent.svg" alt="" loading="lazy" decoding="async">Обновить легаси-продукт</h3>
<p class="">Современный mobile-first опыт и PWA</p>
</article>
</div>
</section>
<section class="vtb-research">
<h2 class="">Исследования</h2><img class="case-image" src="/assets/vtb/imgImage97.png" alt="Результаты UX-аудита и направления редизайна" loading="lazy" decoding="async">
<div class="case-context">
<p>UX-аудит показал, что точечных улучшений интерфейса недостаточно.</p>
<p>Личному кабинету требовалось переосмысление самой продуктовой модели: от сервиса для просмотра данных → к&nbsp;инструменту управления накоплениями и достижения финансовой цели.</p>
<p>Это стало основным принципом дальнейшего проектирования.</p>
</div>
<div class="research-grid">
<div class="findings">
<article><span aria-hidden="true">❌</span>
<div>
<h3 class="">Непрозрачная модель накоплений</h3>
<div class="">
<p>Пользователь видел итоговый баланс, но не понимал его структуру: сколько внесено самостоятельно, сколько получено от государства и какой доход принесли инвестиции.</p>
<p>Это снижало прозрачность продукта и доверие к долгосрочным накоплениям.</p>
</div>
</div>
</article>
<article><span aria-hidden="true">❌</span>
<div>
<h3 class="">Отсутствие навигации к финансовой цели</h3>
<div class="">
<p>Пользователь не понимал, сколько и как часто стоит вносить, чтобы получить максимальную выгоду от программы.</p>
<p>Интерфейс показывал состояние счёта, но практически не помогал его изменить.</p>
</div>
</div>
</article>
<article><span aria-hidden="true">❌</span>
<div>
<h3 class="">Недоступные действия в интерфейсе</h3>
<div class="">
<p>Пользователям показывались сценарии, которыми они не могли воспользоваться по условиям конкретного договора.</p>
<p>Это создавало ложные ожидания, ошибки и дополнительные обращения в поддержку.</p>
</div>
</div>
</article>
<article><span aria-hidden="true">❌</span>
<div>
<h3 class="">Неэффективная адаптация на мобильный веб</h3>
<div class="">
<p>При 76% мобильного трафика интерфейс оставался плохо адаптированным для небольших экранов.</p>
</div>
</div>
</article>
</div><aside class="research-methods"><ul><li>Анализ конкурентных решений в&nbsp;финтехе и накопительных сервисах</li><li>Оценка пользовательских сценариев по&nbsp;эвристикам Нильсена</li><li>Визуальный аудит интерфейса</li><li>Немодерированное юзабилити тестирование ключевых сценариев</li><li>Кабинетный ресерч: анализ отзывов, обращений в поддержку, документации и бизнес-требований и т.д.</li></ul></aside>
</div>
</section>
<section>
<div class="vtb-role">
<p>Моя роль заключалась в проектировании основной части личного кабинета: страниц заключённых договоров и счетов, профиля, авторизации и регистрации.</p>
<p>После формирования ключевых паттернов я самостоятельно развивала продукт, проектируя сценарии расторжения договоров, выплат и назначения правопреемников, а также интегрируя новые бизнес- и регуляторные требования.</p>
</div>
</section>

<h2 class="">Результаты</h2>
<div class="case-lead">
<p>Редизайн ключевых сценариев позволил сместить модель личного кабинета от просмотра данных к выполнению целевых действий, в первую очередь прогнозированию итоговой суммы и подключению автоплатежей.</p>
<p>Эффективность решений была проверена на внутренних usability-тестах и сценариях, приближенных к реальному использованию.</p>
</div>
