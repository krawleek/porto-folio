<main class="case-main" id="case-content">
<section class="case-intro">
<h1>Аудит национальной платежной системы</h1>
<div class="case-lead">
<p>НСПК — это B2B-платформа, которая обрабатывает заявки от банков на выпуск карт «МИР».</p>
<p>Я провела UX-аудит, выявила проблемные зоны, которые мешают легко подключать новые банки, и предложила улучшения через редизайн ключевых сценариев.</p>
</div>
<dl class="case-meta">
<div><dt>Роль</dt><dd>Продуктовый дизайнер</dd>
</div>
<div><dt>Процесс</dt><dd>Research • UX/UI • Usability Testing</dd>
</div>
<div><dt>Команда</dt><dd>Мария Штейн, Project Lead</dd>
</div>
<div><dt>Дата</dt><dd>2025</dd>
</div>
</dl>
<div class="case-cover"><img class="case-cover-image" src="/assets/nspk/hero.png" alt="Обновлённая платформа НСПК — список профилей" loading="lazy" decoding="async">
</div>
</section>
<section class="case-context">
<p>Компания планировала масштабировать систему и подключать больше банков и пользователей. При этом высокий порог входа в работу с системой требовал личного обучения новых сотрудников опытными коллегами.</p>
<p>Это делало рост платформы дорогим и критически зависимым от человеческого фактора.</p>
</section>

<section>
<h2>Бизнес-цели</h2>
<div class="business-goals">
<article>
<h3><img class="goal-icon" src="/assets/nspk/111-8727-imgTime.svg" alt="" loading="lazy" decoding="async">Уменьшить TTV</h3>
<p>Ускорить онбординг новых сотрудников банков</p>
</article>
<article>
<h3><img class="goal-icon" src="/assets/nspk/111-8727-imgWarning.svg" alt="" loading="lazy" decoding="async">Снизить Operational Costs</h3>
<p>Уменьшить количество обращений в поддержку</p>
</article>
<article>
<h3><img class="goal-icon" src="/assets/nspk/111-8727-imgComponent.svg" alt="" loading="lazy" decoding="async">Унифицировать систему</h3>
<p>Привести компоненты к единому стандарту</p>
</article>
</div>

<section>
<h2>Исследования</h2>
<p class="case-lead research-lead">Выявленные проблемы были не отдельными недостатками интерфейса: они проявили глубинное несоответствие между сложностью системы и возможностями пользователей.</p>
<div class="research-grid">
<div class="findings">
<article><span aria-hidden="true">❌</span>
<div>
<h3>Система структурно зрелая, но когнитивно перегруженная</h3>
<p>Система выглядела аккуратно и логично, но в ней было много полей, настроек и терминов, почти не было подсказок, ошибки объяснялись слабо.</p>
<p>Новым пользователям было трудно понять, что от них ждут и в каком порядке действовать.</p>
</div>
</article>
<article><span aria-hidden="true">❌</span>
<div>
<h3>Функциональность не адаптирована под уровень подготовки пользователя</h3>
<p>Один и тот же интерфейс предлагал одинаковый набор действий и настроек всем пользователям — и новичкам, и опытным специалистам. Система не помогала постепенно освоиться и перейти от простых задач к более сложным.</p>
</div>
</article>
<article><span aria-hidden="true">❌</span>
<div>
<h3>Отсутствует визуальная приоритизация и поддержка принятия решений</h3>
<p>Пользователю приходилось самому разбираться, какие поля обязательные, какие действия важнее и на каком этапе он находится, из-за чего возрастал риск ошибок и замедлялась работа.</p>
</div>
</article>
</div><aside class="research-methods"><ul><li>Тестирование System Usability Scale для оценки удобства интерфейса</li><li>Оценка пользовательских сценариев по эвристикам Нильсена</li><li>Проработка решений через редизайн ключевых сценариев</li><li>Тестирование сценариев на контрольной группе</li></ul></aside>
</div>
</section>
<section>
<h2>Принцип Progressive Disclosure</h2>
<p class="case-lead solution-lead">Я разделила сценарии на базовые и расширенные. Базовый сценарий фокусирует на обязательных полях для быстрого старта, а расширенный даёт полный контроль опытным пользователям.</p><img class="case-image" src="/assets/nspk/111-8727-imgImage56.png" alt="Базовый и расширенный сценарии создания профиля" loading="lazy" decoding="async">
</section>
<section>
<h2>Переработка дизайн-системы</h2>
<p class="case-lead solution-lead">Я провела ревизию всех компонентов, удалила лишние сущности и создала унифицированные паттерны для фильтров, таблиц и форм.</p>
<figure class="comparison" id="comparison-1" style="--reveal:50%" aria-label="Дизайн-система: список профилей"><img src="/assets/nspk/112-4124-imgImage265.png" alt="После: Дизайн-система: список профилей" loading="lazy" draggable="false"><img class="comparison-before" src="/assets/nspk/112-4124-imgImage264.png" alt="До: Дизайн-система: список профилей" loading="lazy" draggable="false"><span class="compare-divider" aria-hidden="true"><span>‹ ›</span></span><input type="range" min="0" max="100" value="50" aria-label="Дизайн-система: список профилей: положение шторки" aria-valuetext="До 50%, после 50%">
</figure>
</section>
<section>
<h2>Контекстное обучение</h2>
<div class="case-lead solution-lead">
<p>Инструкции были оформлены отдельным документом, вынуждая постоянно обращаться к файлам и тратить время на загрузку и поиск нужной информации.</p>
<p>Я исправила это и интегрировала базы знаний в интерфейс.</p>
</div>
<figure class="comparison" id="comparison-2" style="--reveal:50%" aria-label="Контекстное обучение: валидация"><img src="/assets/nspk/112-4163-imgImage72.png" alt="После: Контекстное обучение: валидация" loading="lazy" draggable="false"><img class="comparison-before" src="/assets/nspk/112-4163-imgImage266.png" alt="До: Контекстное обучение: валидация" loading="lazy" draggable="false"><span class="compare-divider" aria-hidden="true"><span>‹ ›</span></span><input type="range" min="0" max="100" value="50" aria-label="Контекстное обучение: валидация: положение шторки" aria-valuetext="До 50%, после 50%">
</figure>
</section>
<section>
<h2>Встроенная поддержка принятия решений</h2>
<p class="case-lead solution-lead">Внедрила Contextual Help и визуальное выделение рекомендованных значений.</p><div class="carousel decision-carousel" aria-label="Примеры поддержки принятия решений" aria-roledescription="карусель"><div class="carousel-viewport" tabindex="0" aria-label="Примеры поддержки принятия решений"><div class="carousel-track"><div class="carousel-slide" role="group" aria-roledescription="слайд" aria-label="1 из 2" aria-hidden="false"><img class="case-image" src="/assets/nspk-update/468cd.png" alt="Время ожидания и инструкции по дальнейшим действиям" loading="lazy" decoding="async"></div><div class="carousel-slide" role="group" aria-roledescription="слайд" aria-label="2 из 2" aria-hidden="true"><img class="case-image" src="/assets/nspk-update/974ff.png" alt="Рекомендованные значения дополнительных опций" loading="lazy" decoding="async"></div></div></div><div class="carousel-controls"><button class="carousel-prev" aria-label="Предыдущий слайд">‹</button><div class="carousel-dots"><button data-slide="0" aria-label="Слайд 1" aria-pressed="true"></button><button data-slide="1" aria-label="Слайд 2" aria-pressed="false"></button></div><button class="carousel-next" aria-label="Следующий слайд">›</button></div><p class="sr-only carousel-status" aria-live="polite"></p></div>
</section>
<section class="nspk-outcomes" id="outcomes">
<h2>Результаты</h2>
<div class="case-lead">
<p>Команда НСПК внедрила улучшения по 15+ ключевым сценариям, убирая ограничения для роста платформы.</p>
<p>Продукт получил фундамент для быстрого онбординга новых банков-партнёров, снизил нагрузку на отдел поддержки и уменьшил количество брака при выпуске карт.</p>
</div>
