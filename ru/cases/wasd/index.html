<main class="case-main wasd-main" id="case-content">
<section class="case-intro">
<h1 class="">Редизайн онбординга в WASD</h1>
<div class="case-lead">
<p>WASD.TV — это стриминговая платформа в экосистеме МТС, ориентированная на live-streaming и gaming-аудиторию.</p>
<p>Для сервиса я пересобрала онбординг в систему активации и удержания пользователей, сократив Time-to-Value и снизив churn в первые дни использования платформы.</p>
</div>
<dl class="case-meta">
<div><dt>Роль</dt><dd>Product designer</dd>
</div>
<div><dt>Процесс</dt><dd>Research • Visual Design • UX/UI • Prototyping</dd>
</div>
<div><dt>Команда</dt><dd>Вера Бондарева, Design Lead</dd>
</div>
<div><dt>Дата</dt><dd>Май–Октябрь 2022</dd>
</div>
</dl><img class="wasd-cover" src="/assets/responsive/e837122032bed2c0-1280.webp" alt="Онбординг WASD — знакомство с XP" loading="eager" decoding="async" srcset="/assets/responsive/e837122032bed2c0-640.webp 640w, /assets/responsive/e837122032bed2c0-1280.webp 1280w, /assets/responsive/e837122032bed2c0-1320.webp 1320w, /assets/responsive/e837122032bed2c0-2640.webp 2640w" sizes="(max-width:700px) calc(100vw - 40px), (max-width:1100px) calc(100vw - 64px), (max-width:1440px) calc(100vw - 120px), 1320px" fetchpriority="high">
</section>
<section class="case-context wasd-context">
<p>Платформа привлекала пользователей, но не удерживала их в первые сессии. Пользователи не понимали ключевые преимущества WASD.</p><ul><li>Первый экран не давал релевантного контента</li><li>Лента воспринималась как пустая или случайная</li><li>XP выглядел как сложная и ненужная механика</li><li>Поддержка перегружалась базовыми вопросами</li></ul>
<p>В результате дорогой трафик сгорал на этапе активации.</p>
</section>
<section>
<div class="wasd-before"><img class="case-image" src="/assets/responsive/0c684a6c3bdefe01-1280.webp" alt="Предыдущий интерфейс онбординга WASD" loading="lazy" decoding="async" srcset="/assets/responsive/0c684a6c3bdefe01-640.webp 640w, /assets/responsive/0c684a6c3bdefe01-1280.webp 1280w, /assets/responsive/0c684a6c3bdefe01-1320.webp 1320w, /assets/responsive/0c684a6c3bdefe01-2560.webp 2560w, /assets/responsive/0c684a6c3bdefe01-2640.webp 2640w, /assets/responsive/0c684a6c3bdefe01-4096.webp 4096w" sizes="(max-width:700px) calc(100vw - 40px), (max-width:1100px) calc(100vw - 64px), (max-width:1440px) calc(100vw - 120px), 1320px"><img class="wasd-before-overlay" src="/assets/responsive/1a7a5f35f3f0edfa-1280.webp" alt="" loading="lazy" decoding="async" srcset="/assets/responsive/1a7a5f35f3f0edfa-640.webp 640w, /assets/responsive/1a7a5f35f3f0edfa-1280.webp 1280w, /assets/responsive/1a7a5f35f3f0edfa-1320.webp 1320w, /assets/responsive/1a7a5f35f3f0edfa-2560.webp 2560w, /assets/responsive/1a7a5f35f3f0edfa-2640.webp 2640w, /assets/responsive/1a7a5f35f3f0edfa-3856.webp 3856w" sizes="(max-width:700px) calc(100vw - 40px), (max-width:1100px) calc(100vw - 64px), (max-width:1440px) calc(100vw - 120px), 1320px">
</div>
</section>
<section>
<p class="case-context">Решением стало выстраивание онбординг в систему активации и удержания, которая помогает пользователю быстро найти ценность продукта, формирует привычку возвращаться и увеличивает вовлечённость в ключевые механики платформы</p>
</section><p class="wasd-objective">Цель нового онбординга — помочь пользователю быстро найти ценность продукта, формирует привычку возвращаться и увеличивает вовлечённость в ключевые механики платформы</p>
<section>
<h2 class="">Бизнес-цели</h2>
<div class="business-goals">
<article>
<h3><img class="goal-icon" src="/assets/wasd/imgTime.svg" alt="" loading="lazy" decoding="async">Увеличить D7 Retention</h3>
<p class="">Показать, зачем стоит возвращаться на платформу</p>
</article>
<article>
<h3><img class="goal-icon" src="/assets/wasd/imgWarning.svg" alt="" loading="lazy" decoding="async">Ускорить Time-to-Value</h3>
<p class="">Быстрее давать пользователю релевантный контент</p>
</article>
<article>
<h3><img class="goal-icon" src="/assets/wasd/imgComponent.svg" alt="" loading="lazy" decoding="async">Повысить Feature Adoption</h3>
<p class="">Рост использования сопутствующих сервисов</p>
</article>
</div>
</section>
<section>
<h2 class="">Исследования</h2>
<div class="research-grid">
<div class="findings">
<article><span aria-hidden="true">❌</span>
<div>
<h3 class="">Пользователь не доходит до ценности продукта</h3>
<p class="">Первые минуты в продукте не объясняли, в чем преимущества платформы. Пользователь не находил релевантный контент и не понимал отличия от конкурентов.</p>
</div>
</article>
<article><span aria-hidden="true">❌</span>
<div>
<h3 class="">Онбординг не учитывает уровень пользователя</h3>
<p class="">Все пользователи получали одинаковый опыт, независимо от их контекста и поведения. Система не помогала постепенно осваивать продукт.</p>
</div>
</article>
<article><span aria-hidden="true">❌</span>
<div>
<h3 class="">Фичи не раскрываются в моменте</h3>
<p class="">Подписки, уведомления, XP и другие механики существовали, но не появлялись в момент, когда пользователь был готов их использовать.</p>
</div>
</article>
</div><aside class="research-methods"><ul><li>Анализ CJM и сценариев онбординга пользователей</li><li>Выявление точек потери ценности в первой сессии</li><li>Проработка решений через продуктовые сценарии и growth-механики</li></ul></aside>
</div>
</section>
<section>
<div class="wasd-strategy">
<p>На основе исследований я проработала систему активации пользователя.</p>
<p>В соответствии с принципом Progressive Disclosure продукт постепенно обучает, вовлекает и подводит пользователя к ключевым действиям в момент максимальной готовности к ним.</p>
</div>
</section>

<section class="wasd-outcomes">
<h2 class="">Результаты</h2>
<div class="case-lead"><p>Редизайн онбординга смещает пользовательский сценарий от «пассивного просмотра платформы» к выполнению целевых действий: поиску релевантного контента, подпискам, включению уведомлений и использованию XP-механик.</p></div>
</section>
<section class="case-results">
<div>
<h3 class="">D1/D7 Retention</h3>
<p class="">Персонализация сократила путь до первого meaningful interaction.</p>
</div>
<div>
<h3 class="">Feature Adoption</h3>
<p class="">XP и квесты увеличили использование ключевых механик платформы.</p>
</div>
<div>
<h3 class="">Time To Value</h3>
<p class="">Контекстный онбординг упростил освоение платформы.</p>
</div>
</section>
