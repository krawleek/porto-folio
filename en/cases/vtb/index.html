<section class="case-intro">
<h1 class="">Designing the VTB Pension Fund customer portal</h1>
<div class="case-lead">
<p>VTB Pension Fund is one of Russia’s largest private pension funds, with 11 million customers, managing people’s long-term savings.</p>
<p>I redesigned the legacy system based on a UX audit and developed the portal’s product logic around achieving long-term financial goals.</p>
</div>
<dl class="case-meta">
<div><dt>Role</dt><dd>Product designer</dd>
</div>
<div><dt>Process</dt><dd>Research • UX/UI • Prototyping • Product Vision • Testing</dd>
</div>
<div><dt>Team</dt><dd><span>Roman Benyo, Art Director</span><br><a href="https://edgor.fixframer.ru/" target="_blank" rel="noopener noreferrer"><span>Eduard Gorbunov, Senior Product Designer</span> ↗</a></dd>
</div>
<div><dt>Date</dt><dd>2025–2026</dd>
</div>
</dl>
<div class="vtb-cover"><img class="case-image" src="/assets/vtb/hero.png" alt="Redesigned VTB pension fund customer portal" loading="lazy" decoding="async">
</div>
</section>
<section>
<div class="case-context">
<p>The project began with a UX audit of VTB Pension Fund’s entire digital customer journey, from the corporate website and contract application to the customer portal.</p>
<p>Unlike other touchpoints, the fund’s portal was a legacy product. It let users check their contracts and perform basic operations, but offered little help in understanding the program or deciding what to do next.</p>
</div>
</section>

<section>
<div class="case-context">
<p>This became a business problem: pension programs depend on long-term customer relationships, while their terms are largely set by the government and differ little between funds.</p>
<p>The quality of the customer experience therefore becomes a key competitive advantage.</p>
</div>
</section>
<section>
<h2 class="">Business goals</h2>
<p class="case-lead solution-lead">The business needed more than an updated interface: the digital service had to support long-term customer engagement.</p>
<div class="business-goals">
<article>
<h3><img class="goal-icon" src="/assets/vtb/imgWallet.svg" alt="" loading="lazy" decoding="async">Increase contributions</h3>
<p class="">Grow the use of recurring payments</p>
</article>
<article>
<h3><img class="goal-icon" src="/assets/vtb/imgStats.svg" alt="" loading="lazy" decoding="async">Increase engagement</h3>
<p class="">Savings forecasts and personalized recommendations</p>
</article>
<article>
<h3><img class="goal-icon" src="/assets/vtb/imgComponent.svg" alt="" loading="lazy" decoding="async">Modernize the legacy product</h3>
<p class="">A modern mobile-first experience and PWA</p>
</article>
</div>
</section>
<section class="vtb-research">
<h2 class="">Research</h2><img class="case-image" src="/assets/vtb/imgImage97.png" alt="UX audit findings and redesign opportunities" loading="lazy" decoding="async">
<div class="case-context">
<p>The UX audit showed that isolated interface improvements would not be enough.</p>
<p>The portal needed a new product model: from viewing data to managing savings and achieving financial goals.</p>
<p>This became the guiding principle for the design.</p>
</div>
<div class="research-grid">
<div class="findings">
<article><span aria-hidden="true">❌</span>
<div>
<h3 class="">An unclear savings model</h3>
<div class="">
<p>Users could see their total balance, but not its breakdown: their own contributions, government contributions, and investment income.</p>
<p>This reduced transparency and trust in long-term savings.</p>
</div>
</div>
</article>
<article><span aria-hidden="true">❌</span>
<div>
<h3 class="">No guidance toward a financial goal</h3>
<div class="">
<p>Users did not know how much or how often to contribute to get the most out of the program.</p>
<p>The interface showed the account’s current state but did little to help users change it.</p>
</div>
</div>
</article>
<article><span aria-hidden="true">❌</span>
<div>
<h3 class="">Unavailable actions in the interface</h3>
<div class="">
<p>Users were shown workflows they could not access under the terms of their specific contract.</p>
<p>This created false expectations, errors, and additional support requests.</p>
</div>
</div>
</article>
<article><span aria-hidden="true">❌</span>
<div>
<h3 class="">Poor mobile web adaptation</h3>
<div class="">
<p>Although mobile accounted for 76% of traffic, the interface was poorly adapted to small screens.</p>
</div>
</div>
</article>
</div><aside class="research-methods"><ul><li>Analysis of competing fintech and savings services</li><li>Evaluation of user workflows using Nielsen’s heuristics</li><li>Visual interface audit</li><li>Unmoderated usability testing of key workflows</li><li>Desk research: analysis of reviews, support requests, documentation, business requirements, and more</li></ul></aside>
</div>
</section>
<section>
<div class="vtb-role">
<p>I designed the core of the customer portal: contract and account pages, profiles, login, and registration.</p>
<p>After establishing the key patterns, I independently developed the product further, designing contract termination, payout, and beneficiary workflows while incorporating new business and regulatory requirements.</p>
</div>
</section>

<section>
<h2 class="">Results</h2>
<div class="case-lead">
<p>Redesigning the key workflows shifted the portal from viewing data to taking action, especially forecasting savings and setting up recurring payments.</p>
<p>The solutions were evaluated through internal usability tests and scenarios close to real-world use.</p>
</div>
</section>
