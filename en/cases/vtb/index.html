<section class="case-intro">
<h1 class="">Designing the VTB NPF Client Personal Account</h1>
<div class="case-lead"><p>VTB NPF stands as one of Russia's largest non-state pension funds, serving 11 million clients and managing their long-term savings.</p><p>I led a comprehensive redesign of the legacy system informed by a UX audit, crafting the product logic to focus on supporting clients in achieving their long-term financial objectives.</p></div>
<dl class="case-meta">
<div><dt>Role</dt><dd>Senior Product Designer</dd>
</div>
<div><dt>Scope</dt><dd>Research • UX/UI Design • Prototyping • Product Vision</dd>
</div>
<div><dt>Team</dt><dd><span>Roman Benyo, Art Director</span><br><a href="https://edgor.fixframer.ru/" target="_blank" rel="noopener noreferrer"><span>Eduard Gorbunov, Senior Product Designer</span> ↗</a></dd>
</div>
<div><dt>Date</dt><dd>2025–2026</dd>
</div>
</dl>

<section>
<div class="case-context"><p>The project commenced with a UX audit covering the entire digital client journey at VTB NPF—from the corporate website and contract signing process to the personal account.</p><p>Unlike other touchpoints, the personal account was a legacy product that only allowed users to view contract status and perform basic operations, offering limited guidance on program understanding or next steps.</p></div>
</section>

<section class="vtb-business-context">
<div class="case-context"><p>This presented a business challenge: pension programs are designed for long-term client relationships, with conditions largely regulated by the government and similar across funds.</p><p>Hence, delivering a superior client experience became a critical competitive differentiator.</p></div>
</section>
<section>
<h2 class="">Business Objectives</h2>
<p class="case-lead solution-lead">The goal was not only to modernize the interface but to transform the digital service into a tool that fosters sustained client engagement.</p>
<div class="business-goals">
<article>
<h3><img class="goal-icon" src="/assets/vtb/imgWallet.svg" alt="" loading="lazy" decoding="async">Increase contribution volume</h3>
<p class="">Drive growth in autopayment adoption</p>
</article>
<article>
<h3><img class="goal-icon" src="/assets/vtb/imgStats.svg" alt="" loading="lazy" decoding="async">Enhance user engagement</h3>
<p class="">Provide savings forecasts and personalized recommendations</p>
</article>
<article>
<h3><img class="goal-icon" src="/assets/vtb/imgComponent.svg" alt="" loading="lazy" decoding="async">Redesign the legacy product</h3>
<p class="">Deliver a modern, mobile-first experience with PWA capabilities</p>
</article>
</div>
</section>
<section class="vtb-research">
<h2 class="">Research</h2><div class="vtb-research-art"><img class="case-image" src="/assets/responsive/278fb10416bad229-1280.webp" alt="UX audit findings and redesign opportunities" loading="lazy" decoding="async" srcset="/assets/responsive/278fb10416bad229-640.webp 640w, /assets/responsive/278fb10416bad229-1280.webp 1280w, /assets/responsive/278fb10416bad229-1320.webp 1320w, /assets/responsive/278fb10416bad229-1920.webp 1920w" sizes="(max-width:700px) calc(100vw - 40px), (max-width:1100px) calc(100vw - 64px), (max-width:1440px) calc(100vw - 120px), 1320px"></div>
<div class="case-context"><p>The UX audit revealed that incremental interface tweaks were insufficient.</p><p>The personal account required a fundamental rethinking—from a data display service to a proactive tool for managing savings and achieving financial goals.</p><p>This principle guided the subsequent design process.</p></div>
<div class="research-grid">
<div class="findings">
<article><span aria-hidden="true">❌</span>
<div>
<h3 class="">Opaque Savings Model</h3>
<div class=""><p>Users saw only the final balance without clarity on its composition—personal contributions, government funds, or investment income—undermining transparency and trust.</p></div>
</div>
</article>
<article><span aria-hidden="true">❌</span>
<div>
<h3 class="">Lack of Financial Goal Navigation</h3>
<div class=""><p>Users lacked guidance on optimal contribution amounts and frequency to maximize benefits; the interface displayed status but offered little actionable insight.</p></div>
</div>
</article>
<article><span aria-hidden="true">❌</span>
<div>
<h3 class="">Unavailable Actions in Interface</h3>
<div class=""><p>Users encountered scenarios they could not execute due to contract restrictions, causing false expectations, errors, and increased support requests.</p></div>
</div>
</article>
<article><span aria-hidden="true">❌</span>
<div>
<h3 class="">Poor Mobile Web Adaptation</h3>
<div class=""><p>Despite 76% mobile traffic, the interface was inadequately optimized for small screens.</p></div>
</div>
</article>
</div><aside class="research-methods"><ul><li>Competitive fintech and savings service analysis</li><li>User scenario evaluation via Nielsen heuristics</li><li>Visual interface audit</li><li>Unmoderated usability testing of key flows</li><li>Account research including feedback, support tickets, documentation, and business requirements</li></ul></aside>
</div>
</section>
<section>
<div class="vtb-role"><p>I was responsible for designing core personal account components: contract and account pages, profile, authorization, and registration.</p><p>After establishing foundational patterns, I independently designed contract termination, payouts, heir appointment flows, and integrated new business and regulatory requirements.</p></div>
</section>

<section class="vtb-outcomes">
<h2 class="">Results</h2>
<div class="case-lead"><p>Redesigning key flows transformed the personal account from a passive data viewer to an active tool focused on goal achievement, including savings forecasting and autopayment facilitation.</p><p>Solution effectiveness was validated through internal usability testing.</p></div>
</section>

</div>
