<main class="case-main wasd-main" id="case-content">
<section class="case-intro">
<h1 class="">WASD Onboarding Redesign</h1>
<div class="case-lead"><p>WASD.TV is a live streaming platform within the MTS ecosystem, targeting gaming audiences. I redesigned the onboarding process into a comprehensive user activation and retention system aimed at reducing Time-to-Value and minimizing early user churn.</p></div>
<dl class="case-meta">
<div><dt>Role</dt><dd>Senior Product Designer</dd>
</div>
<div><dt>Process</dt><dd>Research • Visual Design • UX/UI Design • Prototyping</dd>
</div>
<div><dt>Team</dt><dd>Vera Bondareva, Design Lead</dd>
</div>
<div><dt>Date</dt><dd>May – October 2022</dd>
</div>
</dl><img class="wasd-cover" src="/assets/responsive/2055e33d74302715-1280.webp" alt="WASD onboarding: introducing XP" loading="eager" decoding="async" srcset="/assets/responsive/2055e33d74302715-640.webp 640w, /assets/responsive/2055e33d74302715-1280.webp 1280w, /assets/responsive/2055e33d74302715-1320.webp 1320w, /assets/responsive/2055e33d74302715-1536.webp 1536w" sizes="(max-width:700px) calc(100vw - 40px), (max-width:1100px) calc(100vw - 64px), (max-width:1440px) calc(100vw - 120px), 1320px" fetchpriority="high">
</section>
<section class="case-context wasd-context"><p>The platform attracted users but struggled to retain them during initial sessions. Users failed to grasp WASD's core benefits. The first screen lacked relevant content, the feed appeared empty or random, XP was perceived as a complex and unnecessary feature, and support was overwhelmed with basic inquiries. Consequently, costly traffic was lost at the activation stage.</p></section>
<section>
<div class="wasd-before"><img class="case-image" src="/assets/responsive/0c684a6c3bdefe01-1280.webp" alt="Previous WASD onboarding interface" loading="lazy" decoding="async" srcset="/assets/responsive/0c684a6c3bdefe01-640.webp 640w, /assets/responsive/0c684a6c3bdefe01-1280.webp 1280w, /assets/responsive/0c684a6c3bdefe01-1320.webp 1320w, /assets/responsive/0c684a6c3bdefe01-2560.webp 2560w, /assets/responsive/0c684a6c3bdefe01-2640.webp 2640w, /assets/responsive/0c684a6c3bdefe01-4096.webp 4096w" sizes="(max-width:700px) calc(100vw - 40px), (max-width:1100px) calc(100vw - 64px), (max-width:1440px) calc(100vw - 120px), 1320px"><img class="wasd-before-overlay" src="/assets/responsive/1a7a5f35f3f0edfa-1280.webp" alt="" loading="lazy" decoding="async" srcset="/assets/responsive/1a7a5f35f3f0edfa-640.webp 640w, /assets/responsive/1a7a5f35f3f0edfa-1280.webp 1280w, /assets/responsive/1a7a5f35f3f0edfa-1320.webp 1320w, /assets/responsive/1a7a5f35f3f0edfa-2560.webp 2560w, /assets/responsive/1a7a5f35f3f0edfa-2640.webp 2640w, /assets/responsive/1a7a5f35f3f0edfa-3856.webp 3856w" sizes="(max-width:700px) calc(100vw - 40px), (max-width:1100px) calc(100vw - 64px), (max-width:1440px) calc(100vw - 120px), 1320px">
<img src="/assets/responsive/f0f4906bbd2b5049-1280.webp" alt="" class="wasd-before-localized" loading="lazy" srcset="/assets/responsive/f0f4906bbd2b5049-640.webp 640w, /assets/responsive/f0f4906bbd2b5049-1280.webp 1280w, /assets/responsive/f0f4906bbd2b5049-1320.webp 1320w, /assets/responsive/f0f4906bbd2b5049-2560.webp 2560w, /assets/responsive/f0f4906bbd2b5049-2640.webp 2640w, /assets/responsive/f0f4906bbd2b5049-3471.webp 3471w" sizes="(max-width:700px) calc(100vw - 40px), (max-width:1100px) calc(100vw - 64px), (max-width:1440px) calc(100vw - 120px), 1320px" decoding="async"></div>
</section>
<section>
<p class="case-context">The solution involved transforming onboarding into an activation and retention system that enables users to quickly realize product value, develop a habit of returning, and engage more deeply with key platform features.</p>
</section><p class="wasd-objective">The redesigned onboarding aims to help users rapidly discover product value, foster habitual use, and boost engagement with essential platform mechanics.</p>
<section>
<h2 class="">Business Objectives</h2>
<div class="business-goals">
<article>
<h3><img class="goal-icon" src="/assets/wasd/imgTime.svg" alt="" loading="lazy" decoding="async">Increase Day 7 Retention</h3>
<p class="">Demonstrate compelling reasons for users to return</p>
</article>
<article>
<h3><img class="goal-icon" src="/assets/wasd/imgWarning.svg" alt="" loading="lazy" decoding="async">Accelerate Time-to-Value</h3>
<p class="">Deliver relevant content more efficiently</p>
</article>
<article>
<h3><img class="goal-icon" src="/assets/wasd/imgComponent.svg" alt="" loading="lazy" decoding="async">Enhance Feature Adoption</h3>
<p class="">Drive increased usage of related services</p>
</article>
</div>
</section>
<section>
<h2 class="">Research Insights</h2>
<div class="research-grid">
<div class="findings">
<article><span aria-hidden="true">❌</span>
<div>
<h3 class="">Users do not reach product value</h3>
<p class="">Initial product interactions failed to communicate the platform's advantages. Users struggled to find relevant content or distinguish WASD from competitors.</p>
</div>
</article>
<article><span aria-hidden="true">❌</span>
<div>
<h3 class="">Onboarding lacks user-level differentiation</h3>
<p class="">All users experienced the same onboarding regardless of context or behavior, limiting gradual mastery of the product.</p>
</div>
</article>
<article><span aria-hidden="true">❌</span>
<div>
<h3 class="">Features are introduced at inappropriate times</h3>
<p class="">Subscriptions, notifications, XP, and other mechanics existed but were not presented when users were ready to engage with them.</p>
</div>
</article>
</div><aside class="research-methods"><ul><li>Conducted CJM and onboarding scenario analysis, identified value drop-off points in the first session, and developed solutions through product scenarios and growth mechanics.</li></ul></aside>
</div>
</section>
<section>
<div class="wasd-strategy"><p>Based on research, I designed a user activation system that, following Progressive Disclosure principles, gradually educates, engages, and guides users toward key actions when they are most receptive.</p></div>
</section>

<section class="showcase" id="xp-quests" style="--steps:3" aria-label="Introducing XP from First Login" data-step="0">

<div class="showcase-descriptions">
<div class="showcase-step active" aria-hidden="false">
<h2 class="">Introducing XP from First Login</h2>
<p class="showcase-intro">Users did not understand the purpose or value of the internal currency.</p>
<p class="case-lead">We credit a starting XP balance immediately after registration.</p>
</div>
<div class="showcase-step " aria-hidden="true">
<h2 class="">Introducing XP from First Login</h2>
<p class="showcase-intro">Users did not understand the purpose or value of the internal currency.</p>
<p class="case-lead">We demonstrate ways to utilize the currency effectively.</p>
</div>
<div class="showcase-step " aria-hidden="true">
<h2 class="">Learning Through Quests</h2>
<p class="showcase-intro">Key platform features were overlooked and learned haphazardly.</p>
<p class="case-lead">We introduce XP quests to familiarize users with platform tools.</p>
</div>
</div>

<section class="wasd-outcomes">
<h2 class="">Results</h2>
<div class="case-lead"><p>The onboarding redesign shifts user behavior from passive browsing to targeted actions such as discovering relevant content, subscribing, enabling notifications, and engaging with XP mechanics.</p></div>
</section>
<section class="case-results">
<div>
<h3 class="">D1/D7 Retention</h3>
<p class="">Personalization shortens the path to meaningful user interactions.</p>
</div>
<div>
<h3 class="">Feature Adoption</h3>
<p class="">XP and quests drive increased usage of core platform features.</p>
</div>
<div>
<h3 class="">Time to Value</h3>
<p class="">Contextual onboarding simplifies user mastery of the platform.</p>
</div>
</section>
<section>
<p class="wasd-thanks">Special thanks to Design Lead Vera Bondareva for her invaluable guidance and support, especially early in my career.</p>
