<main class="case-main wasd-main" id="case-content">
<section class="case-intro">
<h1 class="">WASD onboarding redesign</h1>
<div class="case-lead">
<p>WASD.TV is a streaming platform in the MTS ecosystem, focused on live streaming and gaming audiences.</p>
<p>I rebuilt onboarding into a user activation and retention system, reducing time to value and churn during the first days on the platform.</p>
</div>
<dl class="case-meta">
<div><dt>Role</dt><dd>Product designer</dd>
</div>
<div><dt>Process</dt><dd>Research • Visual Design • UX/UI • Prototyping</dd>
</div>
<div><dt>Team</dt><dd>Vera Bondareva, Design Lead</dd>
</div>
<div><dt>Date</dt><dd>May–October 2022</dd>
</div>
</dl><img class="wasd-cover" src="/assets/wasd/imgSlide1691417.png" alt="WASD onboarding: introducing XP" loading="lazy" decoding="async">
</section>
<section class="case-context wasd-context">
<p>The platform attracted users but failed to retain them in their first sessions. Users did not understand WASD’s key advantages.</p><ul><li>The first screen did not offer relevant content</li><li>The feed felt empty or random</li><li>XP seemed complicated and unnecessary</li><li>Support was overwhelmed with basic questions</li></ul>
<p>As a result, expensive acquired traffic was lost during activation.</p>
</section>
<section>
<div class="wasd-before"><img class="case-image" src="/assets/wasd/imgImage54.png" alt="Previous WASD onboarding interface" loading="lazy" decoding="async"><img class="wasd-before-overlay" src="/assets/wasd/imgImage55.png" alt="" loading="lazy" decoding="async">
</div>
</section>
<section>
<p class="case-context">The solution was to turn onboarding into an activation and retention system that helps users quickly discover the product’s value, builds a habit of returning, and increases engagement with the platform’s core features.</p>
</section>
<section>
<h2 class="">Business goals</h2>
<div class="business-goals">
<article>
<h3><img class="goal-icon" src="/assets/wasd/imgTime.svg" alt="" loading="lazy" decoding="async">Increase D7 retention</h3>
<p class="">Show users why they should return to the platform</p>
</article>
<article>
<h3><img class="goal-icon" src="/assets/wasd/imgWarning.svg" alt="" loading="lazy" decoding="async">Reduce time to value</h3>
<p class="">Deliver relevant content sooner</p>
</article>
<article>
<h3><img class="goal-icon" src="/assets/wasd/imgComponent.svg" alt="" loading="lazy" decoding="async">Increase feature adoption</h3>
<p class="">Grow the use of supporting services</p>
</article>
</div>
</section>
<section>
<h2 class="">Research</h2>
<div class="research-grid">
<div class="findings">
<article><span aria-hidden="true">❌</span>
<div>
<h3 class="">Users do not reach the product’s value</h3>
<p class="">The first minutes did not explain the platform’s advantages. Users could not find relevant content or understand how it differed from competitors.</p>
</div>
</article>
<article><span aria-hidden="true">❌</span>
<div>
<h3 class="">Onboarding does not adapt to user experience</h3>
<p class="">Everyone received the same experience regardless of context or behavior. The system did not help users learn gradually.</p>
</div>
</article>
<article><span aria-hidden="true">❌</span>
<div>
<h3 class="">Features are not revealed at the right moment</h3>
<p class="">Subscriptions, notifications, XP, and other features existed, but did not appear when users were ready to use them.</p>
</div>
</article>
</div><aside class="research-methods"><ul><li>Analysis of customer journeys and onboarding workflows</li><li>Identifying where users lose value in the first session</li><li>Developing solutions through product workflows and growth mechanisms</li></ul></aside>
</div>
</section>
<section>
<div class="wasd-strategy">
<p>Instead of simple post-registration onboarding, I designed a user activation system.</p>
<p>Using progressive disclosure, the product gradually teaches and engages users, guiding them toward key actions when they are most ready.</p>
</div>
</section>

<p class="showcase-intro">After registration, users did not understand the platform’s value or find relevant content.</p>
<p class="case-lead">We identify users’ interests to personalize content from the very first session.</p>
</div>

</div>

<section class="showcase" id="xp-quests" style="--steps:3" aria-label="Знакомство с XP с первого входа" data-step="0">
<div class="showcase-sticky">
<div class="showcase-copy">
<div class="showcase-dots" aria-hidden="true"><span class="active"></span><span class=""></span><span class=""></span>
</div>
<div class="showcase-descriptions">
<div class="showcase-step active" aria-hidden="false">
<h2 class="">Introducing XP from the first visit</h2>
<p class="showcase-intro">Users did not understand the purpose or value of the platform’s internal currency.</p>
<p class="case-lead">We award a starting balance immediately after registration</p>
</div>
<div class="showcase-step " aria-hidden="true">
<h2 class="">Introducing XP from the first visit</h2>
<p class="showcase-intro">Users did not understand the purpose or value of the platform’s internal currency.</p>
<p class="case-lead">We show how the currency can be used</p>
</div>
<div class="showcase-step " aria-hidden="true">
<h2 class="">Learning through quests</h2>
<p class="showcase-intro">Key features remained unnoticed and were discovered by chance.</p>
<p class="case-lead">We offer quests that reward XP and introduce users to the platform’s tools</p>
</div>
</div>
</div>
<div class="showcase-screen">
<div class="showcase-image active" aria-hidden="false"><img class="" src="/assets/wasd/imgImage93.png" alt="Introducing XP from the first sign-in" loading="lazy" decoding="async">

<section>
<h2 class="">Results</h2>
<div class="case-lead">
<p>The onboarding redesign shifted users from passively browsing the platform to taking meaningful actions: finding relevant content, subscribing, enabling notifications, and using XP features.</p>
<p>The solutions were evaluated through product scenarios, customer journey analysis, and retention-driven flows reflecting real streaming platform behavior.</p>
</div>
</section>
<section class="case-results">
<div>
<h3 class="">D1/D7 Retention</h3>
<p class="">Personalization shortened the path to the first meaningful interaction.</p>
</div>
<div>
<h3 class="">Feature Adoption</h3>
<p class="">XP and quests increased the use of the platform’s key features.</p>
</div>
<div>
<h3 class="">Time To Value</h3>
<p class="">Contextual onboarding made the platform easier to learn.</p>
</div>
</section>
<section>
<p class="wasd-thanks">Many thanks to Design Lead Vera Bondareva for her attention and support, especially valuable at the beginning of my career!</p>
</section>
