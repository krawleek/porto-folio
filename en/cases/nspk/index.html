<section class="case-intro">
<h1>National Payment Card System audit</h1>
<div class="case-lead">
<p>NSPK is a B2B platform that processes banks’ applications to issue MIR cards.</p>
<p>I conducted a UX audit, identified barriers to onboarding new banks, and proposed improvements by redesigning key workflows.</p>
</div>
<dl class="case-meta">
<div><dt>Role</dt><dd>Product Designer</dd>
</div>
<div><dt>Process</dt><dd>Research • UX/UI • Testing</dd>
</div>
<div><dt>Team</dt><dd>Maria Stein, Project Lead</dd>
</div>
<div><dt>Date</dt><dd>2025</dd>
</div>
</dl>
<div class="case-cover"><img class="case-cover-image" src="/assets/nspk/hero.png" alt="Redesigned NSPK platform: profile list" loading="lazy" decoding="async">
</div>
</section>
<section class="case-context">
<p>The company planned to scale the system and onboard more banks and users. However, the steep learning curve meant experienced colleagues had to train new employees individually.</p>
<p>This made platform growth expensive and heavily dependent on people.</p>
</section>
<section class="carousel" aria-label="Slider 1 — исходный интерфейс НСПК" aria-roledescription="карусель">

<section>
<h2>Business goals</h2>
<div class="business-goals">
<article>
<h3><img class="goal-icon" src="/assets/nspk/111-8727-imgTime.svg" alt="" loading="lazy" decoding="async">Reduce TTV</h3>
<p>Speed up onboarding for new bank employees</p>
</article>
<article>
<h3><img class="goal-icon" src="/assets/nspk/111-8727-imgWarning.svg" alt="" loading="lazy" decoding="async">Reduce operational costs</h3>
<p>Reduce support requests</p>
</article>
<article>
<h3><img class="goal-icon" src="/assets/nspk/111-8727-imgComponent.svg" alt="" loading="lazy" decoding="async">Unify the system</h3>
<p>Bring components to a consistent standard</p>
</article>
</div>
</section>
<section>
<h2>Research</h2>
<p class="case-lead research-lead">The issues were more than isolated interface flaws: they revealed a deeper mismatch between the system’s complexity and users’ capabilities.</p>
<div class="research-grid">
<div class="findings">
<article><span aria-hidden="true">❌</span>
<div>
<h3>Structurally mature, but cognitively overwhelming</h3>
<p>The system looked clean and logical, but had too many fields, settings, and technical terms, with few hints and poorly explained errors.</p>
<p>New users struggled to understand what was expected of them and which steps to take first.</p>
</div>
</article>
<article><span aria-hidden="true">❌</span>
<div>
<h3>Functionality did not adapt to user experience</h3>
<p>The interface offered the same actions and settings to beginners and experts alike. It did not help users learn gradually and move from simple tasks to more complex ones.</p>
</div>
</article>
<article><span aria-hidden="true">❌</span>
<div>
<h3>No visual prioritization or decision support</h3>
<p>Users had to work out which fields were required, which actions mattered most, and where they were in the process. This increased errors and slowed down their work.</p>
</div>
</article>
</div><aside class="research-methods"><ul><li>System Usability Scale testing to assess usability</li><li>Evaluation of user workflows using Nielsen’s heuristics</li><li>Developing solutions by redesigning key workflows</li><li>Testing workflows with a control group</li></ul></aside>
</div>
</section>
<section>
<h2>Progressive disclosure</h2>
<p class="case-lead solution-lead">I separated basic and advanced workflows. The basic flow focuses on required fields for a quick start, while the advanced flow gives experienced users full control.</p><img class="case-image" src="/assets/nspk/111-8727-imgImage56.png" alt="Basic and advanced profile creation flows" loading="lazy" decoding="async">
</section>
<section>
<h2>Design system overhaul</h2>
<p class="case-lead solution-lead">I audited every component, removed unnecessary elements, and created consistent patterns for filters, tables, and forms.</p>
<figure class="comparison" id="comparison-1" style="--reveal:50%" aria-label="Дизайн-система: список профилей"><img src="/assets/nspk/112-4124-imgImage265.png" alt="After: profile list with the unified design system" loading="lazy" draggable="false"><img class="comparison-before" src="/assets/nspk/112-4124-imgImage264.png" alt="Before: profile list with the original design system" loading="lazy" draggable="false"><span class="compare-divider" aria-hidden="true"><span>‹ ›</span></span><input type="range" min="0" max="100" value="50" aria-label="Дизайн-система: список профилей: положение шторки" aria-valuetext="До 50%, после 50%">
</figure>
</section>
<section>
<h2>Contextual learning</h2>
<div class="case-lead solution-lead">
<p>Instructions lived in a separate document, forcing users to keep opening files and spend time downloading and searching for information.</p>
<p>I addressed this by integrating the knowledge base into the interface.</p>
</div>
<figure class="comparison" id="comparison-2" style="--reveal:50%" aria-label="Контекстное обучение: валидация"><img src="/assets/nspk/112-4163-imgImage72.png" alt="After: contextual guidance during validation" loading="lazy" draggable="false"><img class="comparison-before" src="/assets/nspk/112-4163-imgImage266.png" alt="Before: validation without contextual guidance" loading="lazy" draggable="false"><span class="compare-divider" aria-hidden="true"><span>‹ ›</span></span><input type="range" min="0" max="100" value="50" aria-label="Контекстное обучение: валидация: положение шторки" aria-valuetext="До 50%, после 50%">
</figure>
</section>
<section>
<h2>Built-in decision support</h2>
<p class="case-lead solution-lead">I introduced contextual help and visual highlighting for recommended values.</p><img class="case-image" src="/assets/nspk/111-8727-imgImage59.png" alt="Contextual hints and recommended form values" loading="lazy" decoding="async">
</section>
<section>
<h2>Results</h2>
<div class="case-lead">
<p>The NSPK team improved over 15 key workflows, removing barriers to platform growth.</p>
<p>The product gained a foundation for faster onboarding of partner banks, reduced support workload, and fewer card issuance errors.</p>
</div>
</section>
<section class="case-results" aria-label="Результаты в цифрах">
<div>
<h3>−32%<br>errors</h3>
<p>Made by new users completing workflows for the first time</p>
</div>
<div>
<h3>Support<br>Load ↓</h3>
<p>Fewer support requests thanks to a clearer interface</p>
</div>
<div>
<h3>Time to<br>Success ↓</h3>
<p>New users completed tasks successfully without outside help</p>
</div>
</section>
