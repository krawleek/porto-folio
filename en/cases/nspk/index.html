<section class="case-intro">
<h1>National Payment System Audit</h1>
<div class="case-lead"><p>NSPK is a B2B platform facilitating bank requests for issuing &quot;MIR&quot; cards. I led a comprehensive UX audit, pinpointed critical onboarding challenges for new banks, and proposed targeted redesigns to streamline key user flows.</p></div>
<dl class="case-meta">
<div><dt>Role</dt><dd>Senior Product Designer</dd>
</div>
<div><dt>Process</dt><dd>Research • UX/UI Design • Usability Testing</dd>
</div>
<div><dt>Team</dt><dd>Maria Shtein, Project Lead</dd>
</div>
<div><dt>Date</dt><dd>2025</dd>
</div>
</dl>
<div class="cpvt-cover-upload"><img src="/assets/nspk-update/cpvt-head.png" alt="Redesigned CPVT platform: profile list" decoding="async"></div>
</section>
<section class="case-context"><p>The company aimed to scale the system by onboarding additional banks and users. However, the steep learning curve necessitated experienced staff to personally train newcomers.</p><p>This dependency made platform growth costly and vulnerable to human resource constraints.</p></section>

<section>
<h2>Business Objectives</h2>
<div class="business-goals">
<article>
<h3><img class="goal-icon" src="/assets/nspk/111-8727-imgTime.svg" alt="" loading="lazy" decoding="async">Reduce Time to Value (TTV)</h3>
<p>Accelerate onboarding for new bank employees</p>
</article>
<article>
<h3><img class="goal-icon" src="/assets/nspk/111-8727-imgWarning.svg" alt="" loading="lazy" decoding="async">Lower Operational Expenses</h3>
<p>Decrease support requests</p>
</article>
<article>
<h3><img class="goal-icon" src="/assets/nspk/111-8727-imgComponent.svg" alt="" loading="lazy" decoding="async">System Unification</h3>
<p>Standardize components across the platform</p>
</article>
</div>

<section>
<h2>Research</h2>
<p class="case-lead research-lead">The issues identified extended beyond isolated interface flaws, revealing a fundamental mismatch between system complexity and user capabilities.</p>
<div class="research-grid">
<div class="findings">
<article><span aria-hidden="true">❌</span><div><h3>Structurally mature system but cognitively overloaded users</h3><p>Despite a logical layout, the system contained numerous fields, settings, and terms with minimal guidance and weak error messaging. New users struggled to understand expectations and workflow sequence.</p></div></article>
<article><span aria-hidden="true">❌</span><div><h3>Functionality not tailored to user expertise</h3><p>Uniform interface presented identical actions and settings to novices and experts alike, lacking progressive task mastery support.</p></div></article>
<article><span aria-hidden="true">❌</span><div><h3>Insufficient visual prioritization and decision support</h3><p>Users had to deduce mandatory fields, prioritize actions, and track progress stages, increasing errors and slowing workflows.</p></div></article>
</div><aside class="research-methods"><ul><li>Conducted System Usability Scale testing to evaluate interface ease of use; assessed user scenarios via Nielsen’s heuristics; developed solutions through key scenario redesign; validated improvements with control group testing.</li></ul></aside>
</div>
</section>
<section>
<h2>Progressive Disclosure</h2>
<p class="case-lead solution-lead">Scenarios were segmented into basic and advanced flows: the basic path emphasized mandatory fields for rapid initiation, while the advanced path offered full control for experienced users.</p><img class="case-image" src="/assets/nspk-update/9e793.png" alt="Basic and advanced profile creation flows" loading="lazy" decoding="async">
</section>
<section>
<h2>Design System</h2>
<p class="case-lead solution-lead">Reviewed all components, eliminated redundancies, and established unified patterns for filters, tables, and forms.</p>
<figure class="comparison" id="comparison-1" style="--reveal:50%" aria-label="Design system: profile list"><img src="/assets/nspk-update/0b2a2.png" alt="After: profile list with the unified design system" loading="lazy" draggable="false"><img class="comparison-before" src="/assets/nspk-update/91202.png" alt="Before: profile list with the original design system" loading="lazy" draggable="false"><span class="compare-divider" aria-hidden="true"><span>‹ ›</span></span><input type="range" min="0" max="100" value="50" aria-label="Design system: profile list: comparison position" aria-valuetext="Before 50%, after 50%">
</figure>
</section>
<section>
<h2>Contextual Learning Integration</h2>
<div class="case-lead solution-lead"><p>Previously, instructions were external, forcing users to switch contexts and spend time searching for information. I integrated knowledge bases directly into the interface to streamline learning.</p></div>
<figure class="comparison" id="comparison-2" style="--reveal:50%" aria-label="Contextual learning: validation"><img src="/assets/nspk-update/6ad4b.png" alt="" loading="lazy" draggable="false"><img src="/assets/nspk-update/b1fd6.png" alt="After: contextual guidance during validation" loading="lazy" draggable="false"><img class="comparison-before" src="/assets/nspk-update/f0d17.png" alt="Before: validation without contextual guidance" loading="lazy" draggable="false"><span class="compare-divider" aria-hidden="true"><span>‹ ›</span></span><input type="range" min="0" max="100" value="50" aria-label="Contextual learning: validation: comparison position" aria-valuetext="Before 50%, after 50%">
</figure>
</section>
<section>
<h2>Embedded Decision Support</h2>
<p class="case-lead solution-lead">Implemented contextual help features and visually emphasized recommended input values.</p><div class="carousel decision-carousel" aria-label="Decision support examples" aria-roledescription="carousel"><div class="carousel-viewport" tabindex="0" aria-label="Decision support examples"><div class="carousel-track"><div class="carousel-slide" role="group" aria-roledescription="slide" aria-label="1 of 2" aria-hidden="false"><img class="case-image" src="/assets/nspk-update/773aa.png" alt="Waiting time and next-step instructions" loading="lazy" decoding="async"></div><div class="carousel-slide" role="group" aria-roledescription="slide" aria-label="2 of 2" aria-hidden="true"><img class="case-image" src="/assets/nspk-update/772ea.png" alt="Recommended additional options" loading="lazy" decoding="async"></div></div></div><div class="carousel-controls"><button class="carousel-prev" aria-label="Previous slide">‹</button><div class="carousel-dots"><button data-slide="0" aria-label="Slide 1" aria-pressed="true"></button><button data-slide="1" aria-label="Slide 2" aria-pressed="false"></button></div><button class="carousel-next" aria-label="Next slide">›</button></div><p class="sr-only carousel-status" aria-live="polite"></p></div>

<section class="nspk-outcomes" id="outcomes">
<h2>Outcomes</h2>
<div class="case-lead"><p>The NSPK team adopted improvements across 15+ critical scenarios, eliminating growth barriers.</p><p>The platform now supports rapid onboarding of partner banks, reduces support demands, and lowers card issuance errors.</p></div>
</section>
